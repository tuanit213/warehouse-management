services:
  frontend:
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
    ports:
      - "${FRONTEND_PORT:-3006}:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  api-gateway:
    restart: unless-stopped
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      INTERNAL_GATEWAY_TOKEN: ${INTERNAL_GATEWAY_TOKEN:?INTERNAL_GATEWAY_TOKEN is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required}:${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}@rabbitmq:5672
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  auth-service:
    restart: unless-stopped
    ports: !reset []
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      INTERNAL_GATEWAY_TOKEN: ${INTERNAL_GATEWAY_TOKEN:?INTERNAL_GATEWAY_TOKEN is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@wms.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Production Admin}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@auth-service-db:5432/${AUTH_DB:-auth_db}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required}:${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}@rabbitmq:5672
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5

  product-service:
    restart: unless-stopped
    ports: !reset []
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      INTERNAL_GATEWAY_TOKEN: ${INTERNAL_GATEWAY_TOKEN:?INTERNAL_GATEWAY_TOKEN is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      PRODUCT_UPLOAD_DIR: ${PRODUCT_UPLOAD_DIR:-/app/uploads/products}
      PRODUCT_IMAGE_MAX_BYTES: ${PRODUCT_IMAGE_MAX_BYTES:-2097152}
      PRODUCT_PUBLIC_BASE_URL: ${PRODUCT_PUBLIC_BASE_URL:-http://localhost:3000/api}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@product-service-db:5432/${PRODUCT_DB:-product_db}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required}:${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}@rabbitmq:5672
    volumes:
      - product-upload-data:/app/uploads/products
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3002/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5

  inventory-service:
    restart: unless-stopped
    ports: !reset []
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      INTERNAL_GATEWAY_TOKEN: ${INTERNAL_GATEWAY_TOKEN:?INTERNAL_GATEWAY_TOKEN is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@inventory-service-db:5432/${INVENTORY_DB:-inventory_db}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required}:${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}@rabbitmq:5672
      TRANSACTION_OUTBOX_EXCHANGE: ${TRANSACTION_OUTBOX_EXCHANGE:-wms.transaction.events}
      INVENTORY_TRANSACTION_CONSUMER_ENABLED: ${INVENTORY_TRANSACTION_CONSUMER_ENABLED:-true}
      INVENTORY_TRANSACTION_EVENTS_QUEUE: ${INVENTORY_TRANSACTION_EVENTS_QUEUE:-wms.inventory.transaction-events}
      INVENTORY_TRANSACTION_DEAD_EXCHANGE: ${INVENTORY_TRANSACTION_DEAD_EXCHANGE:-wms.inventory.transaction-events.dead}
      INVENTORY_TRANSACTION_DEAD_QUEUE: ${INVENTORY_TRANSACTION_DEAD_QUEUE:-wms.inventory.transaction-events.dead}
      INVENTORY_TRANSACTION_CONSUMER_PREFETCH: ${INVENTORY_TRANSACTION_CONSUMER_PREFETCH:-10}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3003/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5

  transaction-service:
    restart: unless-stopped
    ports: !reset []
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      INTERNAL_GATEWAY_TOKEN: ${INTERNAL_GATEWAY_TOKEN:?INTERNAL_GATEWAY_TOKEN is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@transaction-service-db:5432/${TRANSACTION_DB:-transaction_db}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required}:${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}@rabbitmq:5672
      TRANSACTION_OUTBOX_PUBLISHER_ENABLED: ${TRANSACTION_OUTBOX_PUBLISHER_ENABLED:-true}
      TRANSACTION_OUTBOX_EXCHANGE: ${TRANSACTION_OUTBOX_EXCHANGE:-wms.transaction.events}
      TRANSACTION_OUTBOX_DEAD_EXCHANGE: ${TRANSACTION_OUTBOX_DEAD_EXCHANGE:-wms.transaction.events.dead}
      TRANSACTION_OUTBOX_DEAD_QUEUE: ${TRANSACTION_OUTBOX_DEAD_QUEUE:-wms.transaction.events.dead}
      TRANSACTION_OUTBOX_POLL_MS: ${TRANSACTION_OUTBOX_POLL_MS:-2000}
      TRANSACTION_OUTBOX_BATCH_SIZE: ${TRANSACTION_OUTBOX_BATCH_SIZE:-25}
      TRANSACTION_OUTBOX_MAX_ATTEMPTS: ${TRANSACTION_OUTBOX_MAX_ATTEMPTS:-10}
      TRANSACTION_OUTBOX_STALE_MINUTES: ${TRANSACTION_OUTBOX_STALE_MINUTES:-5}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3004/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5

  report-service:
    restart: unless-stopped
    ports: !reset []
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      INTERNAL_GATEWAY_TOKEN: ${INTERNAL_GATEWAY_TOKEN:?INTERNAL_GATEWAY_TOKEN is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@report-service-db:5432/${REPORT_DB:-report_db}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required}:${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}@rabbitmq:5672
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3005/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5

  auth-service-db:
    restart: unless-stopped
    ports: !reset []
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${AUTH_DB:-auth_db}

  product-service-db:
    restart: unless-stopped
    ports: !reset []
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${PRODUCT_DB:-product_db}

  inventory-service-db:
    restart: unless-stopped
    ports: !reset []
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${INVENTORY_DB:-inventory_db}

  transaction-service-db:
    restart: unless-stopped
    ports: !reset []
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${TRANSACTION_DB:-transaction_db}

  report-service-db:
    restart: unless-stopped
    ports: !reset []
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${REPORT_DB:-report_db}

  redis:
    restart: unless-stopped
    ports: !reset []

  rabbitmq:
    restart: unless-stopped
    ports: !reset []
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}

volumes:
  product-upload-data:
