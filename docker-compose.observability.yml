services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: wms-prometheus
    profiles:
      - observability
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${OBSERVABILITY_BIND_HOST:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - api-gateway
      - auth-service
      - product-service
      - inventory-service
      - transaction-service
      - report-service
    networks:
      - wms-network

  grafana:
    image: grafana/grafana:11.4.0
    container_name: wms-grafana
    profiles:
      - observability
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${OBSERVABILITY_BIND_HOST:-127.0.0.1}:${GRAFANA_PORT:-3008}:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - wms-network

  loki:
    image: grafana/loki:3.3.2
    container_name: wms-loki
    profiles:
      - observability
    command:
      - -config.file=/etc/loki/local-config.yml
    volumes:
      - ./ops/loki/local-config.yml:/etc/loki/local-config.yml:ro
      - loki-data:/loki
    ports:
      - "${OBSERVABILITY_BIND_HOST:-127.0.0.1}:${LOKI_PORT:-3100}:3100"
    networks:
      - wms-network

  promtail:
    image: grafana/promtail:3.3.2
    container_name: wms-promtail
    profiles:
      - observability
    command:
      - -config.file=/etc/promtail/config.yml
    volumes:
      - ./ops/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - wms-network

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
