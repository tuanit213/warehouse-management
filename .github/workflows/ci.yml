name: WMS CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --workspaces --include-workspace-root

      - name: Validate Docker Compose
        run: docker compose config

      - name: Static quality
        run: npm run test:quality

      - name: Typecheck services
        run: |
          npx tsc --noEmit -p services/auth-service/tsconfig.json
          npx tsc --noEmit -p services/inventory-service/tsconfig.json
          npx tsc --noEmit -p services/transaction-service/tsconfig.json
          npx tsc --noEmit -p services/api-gateway/tsconfig.json
          npx tsc --noEmit -p services/product-service/tsconfig.json
          npx tsc --noEmit -p services/report-service/tsconfig.json

      - name: Migration dry-run
        run: npm run migrate:dry-run

      - name: Frontend build
        run: npm --workspace frontend run build

      - name: Regression tests
        run: npm run test:regression

      - name: Critical tests
        run: npm run test:critical

      - name: Build workspaces
        run: npm run build --workspaces

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for Gateway readiness
        run: |
          for i in {1..30}; do
            node scripts/health-check.js && exit 0
            sleep 5
          done
          docker compose logs --tail=200
          exit 1

      - name: Smoke test
        run: npm run smoke:test

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=250

      - name: Stop stack
        if: always()
        run: docker compose down

  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            context: ./frontend
          - name: api-gateway
            context: ./services/api-gateway
          - name: auth-service
            context: ./services/auth-service
          - name: product-service
            context: ./services/product-service
          - name: inventory-service
            context: ./services/inventory-service
          - name: transaction-service
            context: ./services/transaction-service
          - name: report-service
            context: ./services/report-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/wms-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_OWNER }}/wms-${{ matrix.name }}:master
