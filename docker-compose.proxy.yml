services:
  caddy:
    image: caddy:2.9-alpine
    container_name: wms-caddy
    profiles:
      - proxy
    restart: unless-stopped
    environment:
      PUBLIC_FRONTEND_HOST: ${PUBLIC_FRONTEND_HOST:?PUBLIC_FRONTEND_HOST is required}
      PUBLIC_API_HOST: ${PUBLIC_API_HOST:?PUBLIC_API_HOST is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
    networks:
      - wms-network

  frontend:
    ports: !reset []

  api-gateway:
    ports: !reset []

volumes:
  caddy-data:
  caddy-config:
